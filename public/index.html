<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Report Generator — Accel Capital Partners</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="logo-block">
        <span class="logo-a">A</span>
        <div class="logo-text">
          <span class="logo-main">ACCEL CAPITAL PARTNERS</span>
          <span class="logo-sub">Weekly Report Generator</span>
        </div>
      </div>
    </div>
  </header>

  <main>
    <form id="reportForm" novalidate>

      <section class="card">
        <h2><span class="num">1</span> Your Details</h2>
        <div class="grid-2">
          <div class="field">
            <label for="name">Full Name <span class="req">*</span></label>
            <input id="name" name="name" type="text" placeholder="e.g. Amanj Mohammed Ali" required />
          </div>
          <div class="field">
            <label for="weekEnding">Week Ending <span class="req">*</span></label>
            <input id="weekEnding" name="weekEnding" type="date" required />
          </div>
          <div class="field">
            <label for="position">Position / Role <span class="req">*</span></label>
            <input id="position" name="position" type="text" placeholder="e.g. Visual Media Marketing Associate" required />
          </div>
        </div>
      </section>

      <section class="card">
        <h2><span class="num">2</span> Weekly Notes</h2>
        <p class="hint">Paste or type anything about your week — tasks done, meetings, challenges, plans. The AI structures it into the full report automatically.</p>
        <div class="field">
          <textarea id="rawNotes" name="rawNotes" rows="16" placeholder="e.g.

Managed social media across Instagram, LinkedIn and TikTok. Daily posting and responding to comments.

Started website redesign research — reviewed current site structure and UX issues.

Team meeting on Monday to discuss content direction.

Need management approval for the boosting budget.

Next week: focus on website redesign and continue social media."></textarea>
        </div>
      </section>

      <div class="generate-bar">
        <button type="submit" id="generateBtn" class="btn-generate">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          Generate Report
        </button>
        <span id="status" class="status"></span>
      </div>

    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
